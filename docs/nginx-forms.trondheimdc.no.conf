# forms.trondheimdc.no: static site (Next.js output: "export") + the two
# Nextcloud paths a public form needs, forwarded the way regnskap forwards
# Fiken. The browser only talks to this site: no CORS, and the CSP stays
# connect-src 'self'. No credentials: the share hash is the permission, the
# same as on hub.trondheimdc.no itself.

server {
    listen 80;
    listen [::]:80;
    server_name forms.trondheimdc.no;

    access_log /var/www/sites/forms.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/forms.trondheimdc.no/logs/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 on the listen line, not `http2 on;`: the server's nginx predates 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forms.trondheimdc.no;

    access_log /var/www/sites/forms.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/forms.trondheimdc.no/logs/error.log;

    root /var/www/sites/forms.trondheimdc.no/public;

    # Added by certbot; keep them when copying this file over.
    ssl_certificate     /etc/letsencrypt/live/forms.trondheimdc.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.trondheimdc.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Note: add_header in a location replaces any from the server level, so each location sets its own.

    # No front page: forms are only reached by their own link. The 404 page says so.
    location = / {
        return 404;
    }

    # /s/{hash}: one prerendered page (s.html) for every form.
    rewrite ^/s/[A-Za-z0-9]+$ /s.html last;

    # ---- Nextcloud (hub.trondheimdc.no, as nextcloudUrl in forms.config.ts) ----
    # Checked like regnskap checks Fiken. Set here once for both locations below.
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;

    # A public form, read out of its share page (src/lib/share-page.ts). It's
    # Nextcloud's HTML on this origin, so it may never run as a page here.
    location /apps/forms/s/ {
        proxy_pass https://hub.trondheimdc.no;
        proxy_set_header Host hub.trondheimdc.no;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Sending an answer (src/lib/submit.ts).
    location /ocs/v2.php/apps/forms/api/v3/forms/ {
        proxy_pass https://hub.trondheimdc.no;
        proxy_set_header Host hub.trondheimdc.no;
        proxy_hide_header Set-Cookie;
    }

    # ---- The site ----

    # Hashed file names: a new deploy gets new names, so these can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages, plus /img and /fonts, which keep their names across deploys.
    # Everything is served from this origin: no third-party scripts, fonts or images.
    # Next and next-themes inline their bootstrap scripts, hence 'unsafe-inline'.
    location / {
        index index.html;
        # Always check for a new deploy, so the page never points at old /_next/static files.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # /tdc-2026 → tdc-2026.html. No SPA fallback: every page is its own file, anything else is a 404.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
