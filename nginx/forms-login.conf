# "Log in with Nextcloud": the locations only the login needs. Parked for
# now (only public forms), so forms.trondheimdc.no.conf doesn't include this
# file. To turn the login on, see src/lib/config.ts and docs/deploy.md.
# Installed as /etc/nginx/snippets/forms-login.conf, included inside the
# HTTPS server block, which defines the limit_req zones.

# The OAuth token request, with the client id and secret added as Basic
# auth (OauthApiController::getToken reads PHP_AUTH_USER/PW).
location = /oauth/token {
    limit_except POST { deny all; }
    limit_req zone=forms_auth burst=10 nodelay;
    if ($http_ocs_apirequest != "true") { return 403; }
    rewrite ^ /index.php/apps/oauth2/api/v1/token break;
    include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
    # proxy_set_header Authorization "Basic <base64 of id:secret>";
    include /etc/nginx/forms-oauth-client.conf;
}

# Who is logged in (the header), and logging out (revokes the token).
location = /ocs/v2.php/cloud/user {
    limit_except GET { deny all; }
    limit_req zone=forms_read burst=20 nodelay;
    if ($http_ocs_apirequest != "true") { return 403; }
    include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
}
location = /ocs/v2.php/core/apppassword {
    limit_except DELETE { deny all; }
    limit_req zone=forms_auth burst=10 nodelay;
    if ($http_ocs_apirequest != "true") { return 403; }
    include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
}

# A logged-in-only form by its own hash: the page that maps it to an id.
location ~ "^/apps/forms/[A-Za-z0-9]{16,}$" {
    limit_except GET { deny all; }
    limit_req zone=forms_read burst=20 nodelay;
    if ($http_ocs_apirequest != "true") { return 403; }
    rewrite ^ /index.php$uri break;
    include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
}

# The user's forms (/admin), and one form by id.
location ~ ^/ocs/v2\.php/apps/forms/api/v3/forms(/[0-9]+)?$ {
    limit_except GET { deny all; }
    limit_req zone=forms_read burst=40 nodelay;
    if ($http_ocs_apirequest != "true") { return 403; }
    include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
}
