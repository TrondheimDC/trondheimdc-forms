# Shared by every location in forms.trondheimdc.no.conf that forwards to
# Nextcloud. Installed as /etc/nginx/snippets/forms-nextcloud-proxy.conf.
# hub.trondheimdc.no must match "nextcloudUrl" in forms.config.ts.
#
# Each location rewrites to the Nextcloud path first, then includes this.
# Page routes go through /index.php/…, which works with or without
# Nextcloud's pretty URLs.

proxy_pass https://hub.trondheimdc.no;
proxy_ssl_server_name on;
proxy_set_header Host hub.trondheimdc.no;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# Nextcloud never sees this site's cookies or sets its own here. The login
# arrives as the browser's own Authorization header, passed through as is.
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;

# Nextcloud's CSRF check (Request::passesCSRFCheck) and its CORS middleware
# both accept a request that says it is an API call.
proxy_set_header OCS-APIRequest "true";

# Some of these are Nextcloud HTML pages, read by the site's JS for the form
# inside. Served from this origin they must never run as pages: no scripts,
# no subresources, sandboxed.
proxy_hide_header Content-Security-Policy;
add_header Content-Security-Policy "default-src 'none'; sandbox" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cache-Control "no-store" always;
