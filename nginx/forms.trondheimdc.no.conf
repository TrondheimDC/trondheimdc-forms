# forms.trondheimdc.no: static site (Next.js output: "export"), no app server.
#
# Besides the static files, nginx forwards a handful of Nextcloud paths, so
# the browser only ever talks to this origin (no CORS, CSP stays
# connect-src 'self'). The browser does "Log in with Nextcloud" itself
# (src/lib/session.ts) and sends its own Bearer token; nginx holds no user
# credentials. The one secret here is the OAuth client's, added to the token
# request, because Nextcloud has no PKCE and wants it there.
#
# Files on the server:
#   /etc/nginx/snippets/forms-nextcloud-proxy.conf   (nginx/forms-nextcloud-proxy.conf)
#   /etc/nginx/forms-oauth-client.conf               (secret, root only, never in git)
# NEXTCLOUD_HOST: see forms-nextcloud-proxy.conf.

# Per visitor. Everything reaches Nextcloud from this server's IP, so these
# are the only per-visitor limits there are.
limit_req_zone $binary_remote_addr zone=forms_read:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=forms_submit:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=forms_auth:1m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name forms.trondheimdc.no;

    access_log /var/www/sites/forms.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/forms.trondheimdc.no/logs/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 on the listen line, not `http2 on;`: the server's nginx predates 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forms.trondheimdc.no;

    access_log /var/www/sites/forms.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/forms.trondheimdc.no/logs/error.log;

    root /var/www/sites/forms.trondheimdc.no/public;

    # Added by certbot; keep them when copying this file over.
    ssl_certificate     /etc/letsencrypt/live/forms.trondheimdc.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.trondheimdc.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Note: add_header in a location replaces any from the server level, so each location sets its own.

    # No front page: forms are only reached by their own link, nothing lists
    # them. The 404 page says so.
    location = / {
        return 404;
    }

    # /s/{hash}: one prerendered page (s.html) for every form.
    rewrite ^/s/[A-Za-z0-9]+$ /s.html last;

    # ---- Nextcloud -------------------------------------------------------
    # Every one of these wants OCS-APIRequest: true, which a page on another
    # site can't send without a CORS preflight that nothing here answers.
    # Links and form posts from elsewhere get a 403.

    # The OAuth token request, with the client id and secret added as Basic
    # auth (OauthApiController::getToken reads PHP_AUTH_USER/PW).
    location = /oauth/token {
        limit_except POST { deny all; }
        limit_req zone=forms_auth burst=10 nodelay;
        if ($http_ocs_apirequest != "true") { return 403; }
        rewrite ^ /index.php/apps/oauth2/api/v1/token break;
        include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
        # proxy_set_header Authorization "Basic <base64 of id:secret>";
        include /etc/nginx/forms-oauth-client.conf;
    }

    # Who is logged in (the header), and logging out (revokes the token).
    location = /ocs/v2.php/cloud/user {
        limit_except GET { deny all; }
        limit_req zone=forms_read burst=20 nodelay;
        if ($http_ocs_apirequest != "true") { return 403; }
        include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
    }
    location = /ocs/v2.php/core/apppassword {
        limit_except DELETE { deny all; }
        limit_req zone=forms_auth burst=10 nodelay;
        if ($http_ocs_apirequest != "true") { return 403; }
        include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
    }

    # A public form, read from its share page (src/lib/share-page.ts).
    # Anonymous on purpose: the share hash is the permission.
    location ~ ^/apps/forms/s/[A-Za-z0-9]+$ {
        limit_except GET { deny all; }
        limit_req zone=forms_read burst=20 nodelay;
        if ($http_ocs_apirequest != "true") { return 403; }
        rewrite ^ /index.php$uri break;
        include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
        proxy_set_header Authorization "";
    }

    # A logged-in-only form by its own hash: the page that maps it to an id.
    location ~ "^/apps/forms/[A-Za-z0-9]{16,}$" {
        limit_except GET { deny all; }
        limit_req zone=forms_read burst=20 nodelay;
        if ($http_ocs_apirequest != "true") { return 403; }
        rewrite ^ /index.php$uri break;
        include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
    }

    # The user's forms (/admin), and one form by id.
    location ~ ^/ocs/v2\.php/apps/forms/api/v3/forms(/[0-9]+)?$ {
        limit_except GET { deny all; }
        limit_req zone=forms_read burst=40 nodelay;
        if ($http_ocs_apirequest != "true") { return 403; }
        include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
    }

    # Submitting: as the logged-in user when the browser sends a token, else
    # anonymously with the share hash in the body.
    location ~ ^/ocs/v2\.php/apps/forms/api/v3/forms/[0-9]+/submissions$ {
        limit_except POST { deny all; }
        limit_req zone=forms_submit burst=5 nodelay;
        limit_req_status 429;
        if ($http_ocs_apirequest != "true") { return 403; }
        client_max_body_size 64k;
        include /etc/nginx/snippets/forms-nextcloud-proxy.conf;
    }

    # ---- The site --------------------------------------------------------

    # Hashed file names: a new deploy gets new names, so these can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages, plus /img, /fonts and /locales, which keep their names across deploys.
    # Everything is served from this origin: no third-party scripts, fonts or images.
    # Next and next-themes inline their bootstrap scripts, hence 'unsafe-inline'.
    # The login keeps a Nextcloud token in sessionStorage: keep this policy tight.
    location / {
        index index.html;
        # Always check for a new deploy, so the page never points at old /_next/static files.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # /auth/callback → auth/callback.html. No SPA fallback: every page is its own file, anything else is a 404.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
